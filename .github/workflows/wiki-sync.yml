name: Publicar wiki

# Publica docs/wiki/ en la wiki del repositorio (https://github.com/<owner>/<repo>/wiki).
# Requisito único: la wiki debe estar activada (Settings > Features > Wikis) y tener
# al menos una página creada desde la web; después basta con re-ejecutar este workflow.

on:
  push:
    branches: [main, ccr-55ceecf7-dpc10i]
    paths:
      - 'docs/wiki/**'
      - '.github/workflows/wiki-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clonar wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki; then
            echo "::error::La wiki no está inicializada. Actívala en Settings > Features > Wikis, crea la primera página desde la web y vuelve a ejecutar este workflow."
            exit 1
          fi

      - name: Copiar páginas
        run: |
          find wiki -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -R docs/wiki/. wiki/
          # En la wiki los enlaces entre páginas van sin la extensión .md
          find wiki -name '*.md' -print0 | xargs -0 sed -i -E 's/\]\(([A-Za-z0-9_-]+)\.md(#[^)]*)?\)/](\1\2)/g'

      - name: Publicar
        run: |
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios en la wiki"
            exit 0
          fi
          git commit -m "docs(wiki): sincroniza desde docs/wiki (${GITHUB_SHA::7})"
          git push
