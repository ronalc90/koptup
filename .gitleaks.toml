# Configuración de gitleaks para el job "Seguridad" de CI (.github/workflows/ci.yml).
# Usa las reglas por defecto de gitleaks y solo excluye los valores ficticios
# de las pruebas (contraseñas y claves de mentira que crean las propias
# pruebas). Un secreto real nunca va en el repositorio, tampoco en una prueba.
title = "KopTup"

[extend]
useDefault = true

[[allowlists]]
description = "Valores ficticios de las pruebas (Jest y Playwright)"
targetRules = ["generic-api-key"]
paths = [
  '''^apps/backend/src/__tests__/''',
  '''^apps/backend/src/test/''',
  '''^apps/web/e2e/''',
  '''^apps/web/src/(.+/)?__tests__/''',
]

[[allowlists]]
description = "Nombres de claves de localStorage de las demos (no son secretos)"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = [
  '''\bSTORAGE_KEY\s*=\s*['"][\w.:-]+['"]''',
]

# Las reglas por defecto no revisan las cadenas de conexión: una URI de
# MongoDB con usuario y contraseña llegó a ADMIN_SETUP.md sin que CI avisara.
[[rules]]
id = "uri-con-credenciales"
description = "Cadena de conexión con usuario y contraseña (MongoDB, Postgres, MySQL, Redis, AMQP)"
regex = '''(?i)\b(?:mongodb(?:\+srv)?|postgres(?:ql)?|mysql|mariadb|rediss?|amqps?)://[^:/@\s"'<>]+:([^@/\s"'<>]{3,})@'''
secretGroup = 1
keywords = ["mongodb", "postgres", "mysql", "mariadb", "redis", "amqp"]

[[rules.allowlists]]
description = "Marcadores de las plantillas y la documentación"
regexTarget = "secret"
regexes = [
  '''^(?i)(password|contrase[nñ]a|pass|secret|changeme|xxx+|\*+|<[^>]*>|\$\{[^}]*\}|\$[A-Z_]+|\{[^}]*\})$''',
]
